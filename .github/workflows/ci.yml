name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Unit tests ────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev] 2>/dev/null || pip install . pytest fakeredis

      - name: Run unit tests
        run: pytest -m "not integration and not e2e" -q

  # ── Integration tests ────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    # Only run for same-repo PRs and pushes (skip forks — no secrets).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres-test:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: event_guru_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_guru_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev] 2>/dev/null || pip install . pytest fakeredis
          pip install pytest-asyncio httpx PyJWT psycopg2-binary

      - name: Initialise test database
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: event_guru_test
        run: psql -f scripts/init_test_db.sql

      - name: Start PostgREST
        run: |
          # Download PostgREST binary
          curl -sL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x86-64.tar.xz \
            | tar xJf - -C /usr/local/bin
          chmod +x /usr/local/bin/postgrest

          # Write config file
          cat > /tmp/postgrest.conf <<EOF
          db-uri = "postgres://authenticator:testpassword@localhost:5433/event_guru_test"
          db-schemas = "public"
          db-anon-role = "anon"
          jwt-secret = "super-secret-jwt-key-for-testing-only-do-not-use-in-prod"
          server-port = 3000
          EOF

          postgrest /tmp/postgrest.conf &
          # Wait for PostgREST to start
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "PostgREST is ready"
              break
            fi
            sleep 1
          done

      - name: Start nginx proxy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null

          # Write nginx config
          sudo tee /etc/nginx/sites-enabled/default > /dev/null <<'EOF'
          server {
              listen 8089;
              location /rest/v1/ {
                  proxy_pass http://127.0.0.1:3000/;
                  proxy_set_header Host $host;
                  proxy_pass_request_headers on;
              }
              location /health {
                  return 200 'ok';
                  add_header Content-Type text/plain;
              }
          }
          EOF

          sudo nginx -t && sudo systemctl restart nginx
          # Wait for nginx
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8089/health > /dev/null 2>&1; then
              echo "nginx proxy is ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        env:
          SUPABASE_URL: http://localhost:8089
          SUPABASE_SERVICE_ROLE_KEY: will-be-generated
          EVENT_GURU_HOST_USER_ID: 00000000-0000-0000-0000-000000000001
          MAPBOX_ACCESS_TOKEN: pk.test-placeholder
          MAPBOX_PERMANENT: "false"
          INGEST_API_TOKEN: test-ingest-api-token
          DEFAULT_AREA_ID: bucharest
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest -m "integration" -q

  # ── E2E Bucharest smoke test (nightly + manual) ─────────────────
  e2e-bucharest:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres-test:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: event_guru_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_guru_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev] 2>/dev/null || pip install . pytest fakeredis
          pip install pytest-asyncio httpx PyJWT psycopg2-binary

      - name: Initialise test database
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: event_guru_test
        run: psql -f scripts/init_test_db.sql

      - name: Start PostgREST
        run: |
          curl -sL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x86-64.tar.xz \
            | tar xJf - -C /usr/local/bin
          chmod +x /usr/local/bin/postgrest

          cat > /tmp/postgrest.conf <<EOF
          db-uri = "postgres://authenticator:testpassword@localhost:5433/event_guru_test"
          db-schemas = "public"
          db-anon-role = "anon"
          jwt-secret = "super-secret-jwt-key-for-testing-only-do-not-use-in-prod"
          server-port = 3000
          EOF

          postgrest /tmp/postgrest.conf &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Start nginx proxy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null
          sudo tee /etc/nginx/sites-enabled/default > /dev/null <<'EOF'
          server {
              listen 8089;
              location /rest/v1/ {
                  proxy_pass http://127.0.0.1:3000/;
                  proxy_set_header Host $host;
                  proxy_pass_request_headers on;
              }
              location /health {
                  return 200 'ok';
                  add_header Content-Type text/plain;
              }
          }
          EOF
          sudo nginx -t && sudo systemctl restart nginx
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8089/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Run E2E Bucharest smoke test
        env:
          SUPABASE_URL: http://localhost:8089
          SUPABASE_SERVICE_ROLE_KEY: will-be-generated
          EVENT_GURU_HOST_USER_ID: 00000000-0000-0000-0000-000000000001
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_PERMANENT: "false"
          INGEST_API_TOKEN: test-ingest-api-token
          DEFAULT_AREA_ID: bucharest
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          PREDICTHQ_API_KEY: ${{ secrets.PREDICTHQ_API_KEY }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
        run: pytest tests/integration/test_e2e_bucharest.py -q
