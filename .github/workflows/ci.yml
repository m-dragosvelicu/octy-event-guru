name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Run unit tests
        run: pytest -m "not integration" -q

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Start integration stack
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for PostgREST readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8089/rest/v1/ -H "apikey: placeholder" >/dev/null 2>&1; then
              echo "PostgREST ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "PostgREST not ready after 60s"
          docker compose -f docker-compose.test.yml logs postgrest
          exit 1

      - name: Run integration tests
        run: pytest -m "integration" -q

      - name: Stop integration stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
