name: Ingest Cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest run
        env:
          INGEST_ENDPOINT: ${{ secrets.INGEST_ENDPOINT }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          DEFAULT_AREA_ID: ${{ secrets.DEFAULT_AREA_ID }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$INGEST_ENDPOINT/v1/ingest/run" \
            -H "Authorization: Bearer $INGEST_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"area_id\": \"$DEFAULT_AREA_ID\", \"dry_run\": false}"

      - name: Notify on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          curl --fail --show-error --silent \
            -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\": \"${{ github.workflow }}\", \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
          || echo "Webhook delivery failed (non-fatal)"
