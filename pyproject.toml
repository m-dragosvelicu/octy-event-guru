[project]
name = "event-guru"
version = "0.1.0"
description = "Event ingestion service for Event Guru"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "extruct>=0.18.0",
    "dateparser>=1.2.0",
    "pydantic-settings>=2.7.0",
    "supabase>=2.10.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "fakeredis>=2.26.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "psycopg2-binary>=2.9.9",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]
include = ["app/**.py", "tests/**.py"]

[tool.ruff.lint]
ignore = ["E721", "E731"]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests requiring external services (PostgREST, Redis)",
    "e2e: end-to-end tests requiring full stack and real API keys",
]
