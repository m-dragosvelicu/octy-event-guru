services:
  postgres-test:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: event_guru_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_guru_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:testpassword@postgres-test:5432/event_guru_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-key-for-testing-only-do-not-use-in-prod
      PGRST_DB_MAX_ROWS: 1000
      PGRST_OPENAPI_MODE: ignore-privileges
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx-proxy:
    image: nginx:1.25-alpine
    depends_on:
      postgrest:
        condition: service_healthy
    ports:
      - "8089:8089"
    volumes:
      - ./scripts/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_test:
